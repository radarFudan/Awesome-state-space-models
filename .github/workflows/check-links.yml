name: Check links

on:
  push:
  pull_request:

jobs:
  offline-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test checker
        run: python -m unittest discover -s tests -v
      - name: Check tracked Markdown links and arXiv IDs
        run: python scripts/check_links.py
